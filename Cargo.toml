[package]
name = "sumi"
version = "0.1.0"
edition = "2024"
description = "Turn a picture into Japanese character art"
license = "MIT"
repository = "https://github.com/00xnova/sumi"
readme = "README.md"
keywords = ["japanese", "ascii-art", "image", "gui"]
categories = ["graphics", "gui"]

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
